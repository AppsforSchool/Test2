<!DOCTYPE html>
<html lang="ja">
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>給食用タイマー</title>
  <meta name="apple-mobile-web-app-capable" content="yes"> 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>


<div class="TimerSetting">
 <div>
  <label for="TimerInput">開始時刻：</label>
  <input type="text"
         id="TimerInput"
         placeholder="時:分:秒"
         value="12:30:00"
         maxlength="8"
         >
 <button onclick="saveValue()" class="changeButtonMain">変更</button>
  <button onclick="normalValue()" class="changeButton">通常日課
  </button>
  <button onclick="fastValue()" class="changeButton">短縮日課
  </button>
   <button onclick="nowValue()" class="changeButton">今の時刻</button>
     
  </div>
  <div>
<p>現在の設定：<span id="displayArea">12:30:00</span> <spen style="font-size: 0.8em;">※時刻は全てチャイム基準</spen></p>
  </div>
</div>

<p></p>
  
<div class="TimerDisplay">
  <spen>給食まで</spen>
  <div class="TimerDisplayNumber">12:34.567</div>
    
</div>
  
</body>
</html>
 
<script>
  <script>
  function saveValue() {
  // ① input要素から値を取得
  const timerInput = document.getElementById('TimerInput');
  const inputValue = timerInput.value;

  // ② displayAreaに取得した値を表示
  const displayArea = document.getElementById('displayArea');
  displayArea.textContent = inputValue;
}
  function normalValue() {
    const timerInput = document.getElementById('TimerInput');
    timerInput.value = '12:30:00';
  }
  function fastValue() {
    const timerInput = document.getElementById('TimerInput');
    timerInput.value = '12:10:00';
  }
  function nowValue() {
    let beforeNow = new Date();
    let now = new Date(beforeNow.getTime() + 80000);
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const formattedTime = `${hours}:${minutes}:${seconds}`;
    const timerInput = document.getElementById('TimerInput');
    timerInput.value = formattedTime;
  }
  
</script>
